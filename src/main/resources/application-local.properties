spring.application.name=examprep_backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_orep_backend_dbsys
spring.datasource.username=postgres
spring.datasource.password=12345678

#create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Multipart rules
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
# Directory to store uploaded PDFs
#pdf.upload.dir=C:\Users\User\Downloads\exam_prep_backend\src\main\resources\uploads\pdf
file.upload-dir=src/main/resources/static/uploads/pdf/


